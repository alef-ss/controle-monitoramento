<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Ícones -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  >

  <title>Painel de Controle</title>
</head>

<body class="bg-light">

  <div class="container py-4">

    <!-- Título -->
    <div class="mb-4">
      <h4 class="fw-semibold">Registro de Controle</h4>
      <hr>
    </div>

    <!-- FORMULÁRIO -->
    <form>

      <div class="row g-4">

        <!-- Número do carro -->
        <div class="col-md-3">
          <label class="form-label fw-semibold">
            Número do carro
          </label>
          <input
            type="number"
            class="form-control"
            placeholder="Ex: 2407"
            min="2400"
            max="2459"
            required
          >
        </div>

        <!-- Data do registro -->
        <div class="col-md-3">
          <label class="form-label fw-semibold">
            Data do registro
          </label>
          <input
            type="date"
            id="dataRegistro"
            class="form-control"
          >
        </div>

        <!-- Gravação -->
        <div class="col-md-3">
          <label class="form-label fw-semibold">
            Possui gravação
          </label>

          <div class="form-check">
            <input class="form-check-input" type="radio" name="gravacao" value="sim">
            <label class="form-check-label">Sim</label>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="radio" name="gravacao" value="nao">
            <label class="form-check-label">Não</label>
          </div>
        </div>

        <!-- Status -->
        <div class="col-md-3">
          <label class="form-label fw-semibold">
            Status
          </label>

          <div class="form-check">
            <input class="form-check-input" type="radio" name="trocado" value="sim">
            <label class="form-check-label">Trocado</label>
          </div>

          <div class="form-check">
            <input class="form-check-input" type="radio" name="trocado" value="nao">
            <label class="form-check-label">Não trocado</label>
          </div>
        </div>

      </div>

      <!-- Botão -->
      <div class="mt-4 d-flex justify-content-end">
        <button type="submit" class="btn btn-primary px-4">
          Registrar
        </button>
      </div>

    </form>

    <!-- REGISTROS ANTERIORES -->
    <hr class="my-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-semibold mb-0">
        Registros anteriores
      </h5>

      <!-- Filtro por data -->
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-calendar3"></i>
        <input
          type="date"
          id="dataRegistrada"
          class="form-control form-control-sm"
          style="max-width: 160px"
        >
      </div>
    </div>

    <!-- Tabela de registros -->
    <div class="table-responsive">
      <table class="table table-sm table-bordered align-middle">
        <thead class="table-secondary">
          <tr>
            <th>Data</th>
            <th>Carro</th>
            <th>Gravação</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <!-- Exemplo -->
          <tr>
            <td>15/01/2026</td>
            <td>2418</td>
            <td>Sim</td>
            <td>Não trocado</td>
          </tr>
          <tr>
            <td>15/01/2026</td>
            <td>2453</td>
            <td>Sim</td>
            <td>Trocado</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Data automática de hoje -->
  <script>
    document.getElementById('dataRegistro').value =
      new Date().toISOString().split('T')[0];


    var data = new Date();
    data.setDate(data.getDate() - 1);
    document.getElementById('dataRegistrada').value = data.toISOString().split('T')[0];
  </script>

</body>
</html>
